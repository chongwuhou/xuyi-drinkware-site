name: XUYI source build and Cloudflare Pages publication
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-xuyi.yml"
      - "templates/**"
      - "scripts/**"
      - "build.py"
      - "site_renderer.py"
      - "seo_structured_components.py"
      - "product_share_source.py"
      - "product_locale_seo.py"
      - "product_material_performance.py"
      - "media_quality_guard.py"
      - "sitemap_modification.py"
      - "image_alt_quality.py"
      - "media_alt_render.py"
      - "locale_registry.py"
      - "home_banner_config.py"
      - "capability_*.py"
      - "blog_editorial.py"
      - "blog_*.py"
      - "product_content.py"
      - "factory_catalog_locales.py"
      - "factory_product_locales.py"
      - "catalog_extensions.py"
      - "product_source_identity.py"
      - "editorial_support.py"
      - "home_enhancements.py"
      - "resource_pages.py"
      - "why_us_*.py"
      - "data/**"
      - "lo_catalog.py"
      - "assets/**"
      - "admin/**"
      - "functions/**"
      - "deployment/**"
      - "AGENTS.md"
      - "PROJECT_CHANGE_POLICY.md"
      - "docs/BLOG_COVER_VISUAL_STANDARD.md"
      - "docs/BLOG_EDITORIAL_PUBLISH_CHECKLIST.md"
      - "_headers"
  workflow_dispatch:
    inputs:
      blog_batch_path:
        description: "Reviewed Blog batch JSON to publish through the D1/R2 CMS route"
        required: false
        type: string
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: xuyi-drinkware-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      XUYI_INDEXNOW_KEY: ${{ secrets.XUYI_INDEXNOW_KEY }}
      CLOUDFLARE_ACCOUNT_ID: a4032d0251103d6ef680b2aaddce1afc
      SITE_ORIGIN: https://xuyibottles.com
      XUYI_PUBLISH_REVISION: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical human and AI operating runbook
        run: python scripts/test_operating_runbook.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail fast on Pages Function syntax
        run: python scripts/test_pages_functions_syntax.py
      - name: Install pinned build-only image encoder
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Verify repository hygiene and generic entrypoints
        run: python scripts/test_repository_hygiene.py
      - name: Validate site isolation
        run: python scripts/preflight.py
      - name: Verify D1-configured language and single Blog publish guards
        run: python scripts/test_dynamic_language_and_publish_guards.py
      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::XUYI Pages publication requires its independent Cloudflare GitHub Actions secrets."
          fi
      - name: Publish reviewed Blog batch to D1 and R2
        if: steps.credential.outputs.ready == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.blog_batch_path != '') || (github.event_name == 'push' && hashFiles('data/reviewed-blog-batch.json') != ''))
        run: |
          batch_path="${{ inputs.blog_batch_path }}"
          if [ -z "$batch_path" ]; then batch_path="data/reviewed-blog-batch.json"; fi
          python scripts/publish_blog_batch.py "$batch_path"
      - name: Prepare stable IndexNow ownership key
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XUYI_INDEXNOW_KEY}" ]; then
            derived="$(python -c 'import hashlib,hmac,os; print(hmac.new(os.environ["CLOUDFLARE_API_TOKEN"].encode(), b"indexnow:xuyibottles.com:v2", hashlib.sha256).hexdigest()[:32])')"
            # Keep the public ownership key out of CI step environment logs.
            echo "::add-mask::$derived"
            echo "XUYI_INDEXNOW_KEY=$derived" >> "$GITHUB_ENV"
            echo "XUYI IndexNow ownership key prepared from the protected deployment credential."
          fi
      - name: Guard against competing Cloudflare Git auto deployments
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/xuyi-drinkware-site" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||j.result?.name!=='xuyi-drinkware-site')throw new Error('XUYI project identity mismatch');const c=j.result?.source?.config||{};if(c.production_deployments_enabled!==false||c.preview_deployment_setting!=='none')throw new Error('Disable old Git auto deploy for XUYI before enabling the CI publisher');console.log('One controlled production publisher verified')})"
      - name: Apply guarded Blog source migrations through D1/CMS
        if: steps.credential.outputs.ready == 'true'
        run: python scripts/repair_blog_source.py
      - name: Read XUYI D1 publish revision
        if: steps.credential.outputs.ready == 'true' && github.event_name == 'schedule'
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          current="$(curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$SITE_ORIGIN/api/publish-state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let v=JSON.parse(s);process.stdout.write(String(Number(v.publishRevision||0)))})")"
          deployed="$(curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN/build-meta.json?ci_poll=${{ github.run_id }}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let v=JSON.parse(s);process.stdout.write(String(Number(v.publishRevision||0)))})")"
          echo "revision=$current" >> "$GITHUB_OUTPUT"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "XUYI_PUBLISH_REVISION=$current" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$current" -gt "$deployed" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify XUYI CMS APIs against D1 (read-only)
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          for section in brand-config site-config pages product-content page-content page-translations; do
            curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$SITE_ORIGIN/api/admin/$section" -o /dev/null
            echo "XUYI D1 CMS OK: $section"
          done
      - name: Record previous sitemap notification state
        if: github.event_name != 'schedule' || steps.revision.outputs.needed == 'true'
        shell: bash
        run: |
          mkdir -p _local_ops
          curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN/search-submission-manifest.json?previous=$GITHUB_RUN_ID" -o _local_ops/previous-search-submission-manifest.json || rm -f _local_ops/previous-search-submission-manifest.json
          curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN/robots.txt?previous=$GITHUB_RUN_ID" -o _local_ops/previous-robots.txt || rm -f _local_ops/previous-robots.txt
      - name: Block indexing launch if old raw source cache is still public
        if: github.event_name != 'schedule' || steps.revision.outputs.needed == 'true'
        run: python scripts/preindex_security_gate.py
      - name: Build from shared templates and source data
        if: github.event_name != 'schedule' || steps.revision.outputs.needed == 'true'
        # The public site must run the authenticated XUYI snapshot endpoint.
        # The revision and content are read from the same D1 snapshot.
        run: |
          python scripts/fetch_build_snapshot.py
          python scripts/build_release.py
      - name: Validate release artifact and inquiry readiness
        if: github.event_name != 'schedule' || steps.revision.outputs.needed == 'true'
        run: |
          python scripts/test_release.py
          python scripts/test_shared_templates.py
          python scripts/test_responsive_images.py
          python scripts/test_faq_access.py
          python scripts/test_shaker_wholesale_faq_source.py
          python scripts/test_home_banners.py
          python scripts/test_home_brand_logos.py
          node scripts/test_home_banners_api.mjs
          python scripts/test_single_product_module.py
          node scripts/test_single_product_api.mjs
          python scripts/test_product_reviews_source.py
          node scripts/test_product_reviews_api.mjs
          python scripts/test_daily_product_reviews.py
          python scripts/test_product_components.py
          python scripts/test_buyer_content.py
          python scripts/test_model_catalog_buyer_comparison.py
          python scripts/test_curated_application_feature_answers.py
          python scripts/test_source_buyer_decision_content.py
          python scripts/test_d1_blog_field_authority.py
          python scripts/test_about_company_source.py
          python scripts/test_visible_catalog_schemas.py
          python scripts/test_editorial_evidence.py
          python scripts/test_editorial_d1_overrides.py
          python scripts/test_blog_source_migrations.py
          node scripts/test_blog_dynamic_evidence.mjs
          python scripts/test_blog_listing_single_header.py
          python scripts/test_blog_pagination_source.py
          python scripts/test_blog_card_contract.py
          node scripts/test_blog_pagination_runtime.mjs
          python scripts/test_seo_multilingual_launch.py
          python scripts/test_phase2_blog_seo.py
          python scripts/test_d1_blog_field_authority.py
          python scripts/test_priority_seo.py
          python scripts/test_cms_seo_rebuild_policy.py
          python scripts/test_source_of_truth_policy.py
          python scripts/test_verified_trust_technical_seo.py
          python scripts/test_contextual_share_metadata.py
          python scripts/test_owner_contextual_links_survive_rebuild.py
          python scripts/test_source_modules_survive_owner_rebuild.py
          python scripts/test_verified_capacity_gradient.py
          python scripts/test_operating_runbook.py
      - name: Verify second clean source rebuild and CMS-owner priority
        if: github.event_name != 'schedule' || steps.revision.outputs.needed == 'true'
        run: |
          python scripts/fetch_build_snapshot.py
          python scripts/build_release.py
          python scripts/test_release.py
          python scripts/test_shared_templates.py
          python scripts/test_source_of_truth_policy.py
          python scripts/test_blog_source_migrations.py
          python scripts/test_cms_seo_rebuild_policy.py
          python scripts/test_seo_multilingual_launch.py
          python scripts/test_phase2_blog_seo.py
          python scripts/test_blog_listing_single_header.py
          python scripts/test_blog_pagination_source.py
          python scripts/test_blog_card_contract.py
          node scripts/test_blog_pagination_runtime.mjs
          echo "XUYI_SECOND_CLEAN_GENERIC_REBUILD_PASSED"
      - name: No changes in the XUYI D1 publish revision
        if: github.event_name == 'schedule' && steps.revision.outputs.needed == 'false'
        run: echo "No changes; skipped build and deploy to preserve GitHub Actions usage."
      - name: Skip when controller is unconfigured
        if: steps.credential.outputs.ready != 'true'
        run: echo "Build verified; production unchanged. Add the XUYI-only GitHub Actions secrets."
      - name: Synchronize approved overflow model bundles to XUYI R2
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        run: node scripts/sync_model_overflow.mjs
      - name: Deploy XUYI production
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        run: npx --yes wrangler@4.148.0 pages deploy dist --project-name xuyi-drinkware-site --branch main
      - name: Verify XUYI live deployment
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          # A just-added Functions endpoint cannot be probed before its first deployment.
          # Verify it here, after Pages deploy, with the existing authenticated build token.
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$SITE_ORIGIN/api/admin/home-banners" -o /dev/null
          for n in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN/build-meta.json?xuyi_check=$n&sha=$GITHUB_SHA" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);process.exit(v.pagesProject==='xuyi-drinkware-site'&&v.sourceRevision===process.env.GITHUB_SHA&&Number(v.publishRevision)>=Number(process.env.XUYI_PUBLISH_REVISION)?0:1)})"; then
              echo "XUYI production revision verified"
              exit 0
            fi
            sleep 15
          done
          echo "::error::XUYI production build-meta did not update"
          exit 1
      - name: Notify IndexNow of verified changed URLs
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XUYI_INDEXNOW_KEY}" ]; then
            echo "::warning::IndexNow inactive: add XUYI_INDEXNOW_KEY repository secret."
            exit 0
          fi
          python scripts/search_submission.py --submit





